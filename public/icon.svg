<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="4" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-dasharray="8 12" />

  <!-- Core Coin Shape -->
  <circle cx="256" cy="256" r="150" fill="url(#coinGrad)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="142" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="4" />

  <!-- Inner Dark Hub -->
  <circle cx="256" cy="256" r="115" fill="#0f172a" />

  <!-- Trending Pulse Wave Behind ON -->
  <path d="M 160 270 L 205 270 L 230 220 L 260 295 L 290 240 L 315 270 L 352 270" 
        fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

  <!-- ON Typographic Emblem -->
  <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central">
    <text x="256" y="254" font-size="96" letter-spacing="-3" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))">
      ON
    </text>
  </g>

  <!-- Live Pulse Dot -->
  <circle cx="340" cy="180" r="16" fill="#10b981" stroke="#ffffff" stroke-width="4" />
</svg>
